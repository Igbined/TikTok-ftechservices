<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to TikTok</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- Modal Container -->
    <div class="bg-white w-full max-w-[480px] h-screen sm:h-auto sm:min-h-[580px] sm:rounded-xl shadow-none sm:shadow-xl flex flex-col justify-between relative overflow-hidden">

        <!-- Top Header Navigation -->
        <div class="flex items-center justify-between px-6 pt-6 pb-2">
            <!-- Close Button -->
            <button class="text-black hover:text-gray-600 transition-colors p-1" aria-label="Close">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
            <!-- Help Button -->
            <button class="text-black hover:text-gray-600 transition-colors p-1" aria-label="Help">
                <i class="fa-regular fa-circle-question text-2xl"></i>
            </button>
        </div>

        <!-- Main Content Body -->
        <div class="px-6 sm:px-12 flex-1 flex flex-col items-center text-center justify-center my-auto py-8">
            
            <!-- Title & Subtitle -->
            <h1 class="text-2xl sm:text-3xl font-bold text-black tracking-tight mb-3">Log in to TikTok</h1>
            <p class="text-gray-500 text-sm max-w-[320px] leading-relaxed mb-8">
                Manage your account, check notifications, comment on videos, and more.
            </p>

          <!-- Buttons List -->
<div class="w-full">
    <!-- Use phone / email / username -->
    <button onclick="window.location.href='login.html'"
            class="w-full flex items-center justify-center py-3.5 px-4 border border-gray-300 rounded-md font-semibold text-black hover:bg-gray-50 active:bg-gray-100 transition-colors relative text-sm sm:text-base">
        <span class="absolute left-4 flex items-center text-black">
            <i class="fa-solid fa-user text-lg"></i>
        </span>
        <span>Use phone / email / username</span>
    </button>
</div>

        </div>

        <!-- Bottom Disclaimer and Footer Group -->
        <div class="w-full flex flex-col">
            <!-- Terms Disclaimer -->
            <div class="px-6 sm:px-12 pb-6 text-center">
                <p class="text-[11px] sm:text-xs text-gray-400 leading-normal">
                    By continuing with an account located in <span class="font-semibold text-gray-600">Nigeria</span>, you agree to our <a href="#" class="text-gray-700 underline font-medium hover:text-black">Terms of Service</a> and acknowledge that you have read our <a href="#" class="text-gray-700 underline font-medium hover:text-black">Privacy Policy</a>.
                </p>
            </div>

            <!-- Footer Sign Up Bar -->
            <div class="border-t border-gray-200 py-4 bg-gray-50 flex items-center justify-center text-sm">
                <span class="text-gray-600 mr-1.5">Don’t have an account?</span>
                <a href="#" class="text-[#fe2c55] font-semibold hover:underline">Sign up</a>
            </div>
        </div>

    </div>

</body>
</html>
