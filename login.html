    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - TikTok</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        input:focus {
            outline: none;
        }
        /* Custom scrollbar for country dropdown */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- Main Modal Card -->

                </button>
                <!-- Title -->
                <h1 class="text-[17px] font-semibold text-gray-900 tracking-normal">Log in</h1>
                <!-- Help Icon -->

                    <i class="fa-regular fa-circle-question text-lg text-gray-800"></i>
                </button>
            </div>

            <!-- Tabs Navigation Header -->
            <div class="mt-2 px-6 border-b border-gray-200">
                <div class="flex justify-between w-full relative">
                    <!-- Phone Tab Button -->
                    <button id="phone-tab-btn" onclick="switchTab('phone')" 
                        class="w-1/2 pb-3 text-center text-sm font-semibold transition-colors duration-150 text-gray-900 border-b-2 border-black -mb-[1px]">
                        Phone
                    </button>
                    
                    <!-- Email / Username Tab Button -->
                    <button id="email-tab-btn" onclick="switchTab('email')" 
                        class="w-1/2 pb-3 text-center text-sm font-semibold transition-colors duration-150 text-gray-400 hover:text-gray-600 border-b-2 border-transparent -mb-[1px]">
                        Email / Username
                    </button>
                </div>
            </div>

            <!-- TAB 1: PHONE FORM VIEW -->
            <div id="phone-tab-view" class="px-6 pt-7 block relative">
                <!-- Phone input with Country Selector -->
                <div class="flex items-center border-b border-gray-200 pb-2.5 focus-within:border-gray-900 transition-colors relative">
                    <!-- Country Code Dropdown Trigger -->
                    <button type="button" onclick="toggleCountryDropdown(event)" class="flex items-center space-x-1 cursor-pointer pr-3 select-none text-left focus:outline-none">
                        <span id="selected-country-flag" class="text-base mr-1">🇳🇬</span>
                        <span id="selected-country-code" class="font-normal text-gray-900 text-sm">NG +234</span>
                        <i class="fa-solid fa-chevron-down text-[10px] text-gray-500 ml-1"></i>
                    </button>
                    
                    <!-- Vertical Divider Line -->
                    <div class="h-3.5 w-[1px] bg-gray-200 mr-3"></div>

                    <!-- Phone Number Input -->
                    <input id="phone-input" type="tel" placeholder="Phone number" oninput="checkPhoneForm()"
                        class="w-full text-sm text-gray-900 placeholder-gray-300 bg-transparent font-normal" />
                </div>

                <!-- Searchable Country Code Dropdown Menu -->
                <div id="country-dropdown" class="hidden absolute top-[72px] left-6 right-6 bg-white border border-gray-200 rounded-lg shadow-xl z-50 max-h-[320px] flex flex-col">
                    <!-- Search Input inside dropdown -->
                    <div class="p-2.5 border-b border-gray-100 sticky top-0 bg-white rounded-t-lg">
                        <div class="flex items-center bg-gray-100 rounded px-2.5 py-1.5">
                            <i class="fa-solid fa-magnifying-glass text-gray-400 text-xs mr-2"></i>
                            <input id="country-search-input" type="text" placeholder="Search country or code..." oninput="filterCountries()"
                                class="w-full text-xs text-gray-800 bg-transparent focus:outline-none placeholder-gray-400 font-normal" />
                        </div>
                    </div>
                    
                    <!-- Country List Container -->
                    <div id="country-list" class="overflow-y-auto custom-scrollbar flex-1 py-1">
                        <!-- Populated dynamically via JavaScript -->
                    </div>
                </div>

                <!-- Submit Button -->
                <button id="phone-login-btn" disabled 
                    class="w-full mt-7 py-3 bg-[#f1f1f2] text-gray-300 font-semibold rounded-[4px] transition-all cursor-not-allowed text-sm tracking-wide">
                    Log in
                </button>
            </div>

            <!-- TAB 2: EMAIL / USERNAME FORM VIEW -->
            <div id="email-tab-view" class="px-6 pt-7 hidden">
                <!-- Email/Username Input -->
                <div class="border-b border-gray-200 pb-2.5 mb-5 focus-within:border-gray-900 transition-colors">
                    <input id="email-input" type="text" placeholder="Email or username" oninput="checkEmailForm()"
                        class="w-full text-sm text-gray-900 placeholder-gray-300 bg-transparent font-normal" />
                </div>

                <!-- Password Input -->
                <div class="border-b border-gray-200 pb-2.5 mb-4 focus-within:border-gray-900 transition-colors">
                    <input id="password-input" type="password" placeholder="Password" oninput="checkEmailForm()"
                        class="w-full text-sm text-gray-900 placeholder-gray-300 bg-transparent font-normal" />
                </div>

                <!-- Forgot Password Link -->
                <div class="mb-7">
                    <a href="#" class="text-xs font-semibold text-gray-900 hover:underline">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button id="email-login-btn" disabled 
                    class="w-full py-3 bg-[#f1f1f2] text-gray-300 font-semibold rounded-[4px] transition-all cursor-not-allowed text-sm tracking-wide">
                    Log in
                </button>
            </div>

        </div>

            { name: "Zimbabwe", iso: "ZW", code: "+263", flag: "🇿🇼" }
        ];

        function renderCountries(list) {
            const countryListContainer = document.getElementById('country-list');
            countryListContainer.innerHTML = '';

            if (list.length === 0) {
                countryListContainer.innerHTML = '<div class="px-3 py-2 text-xs text-gray-400 text-center">No countries found</div>';
                return;
            }

            list.forEach(c => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between px-3 py-2 hover:bg-gray-50 cursor-pointer text-xs transition-colors border-b border-gray-50 last:border-none';
                item.onclick = () => selectCountry(c);
                item.innerHTML = `
                    <div class="flex items-center space-x-2 truncate pr-2">
                        <span>${c.flag}</span>
                        <span class="text-gray-800 font-medium truncate">${c.name}</span>
                    </div>
                    <span class="text-gray-500 font-normal shrink-0">${c.iso} ${c.code}</span>
                `;
                countryListContainer.appendChild(item);
            });
        }

        // Toggle country dropdown visibility
        function toggleCountryDropdown(e) {
            if (e) e.stopPropagation();
            const dropdown = document.getElementById('country-dropdown');
            const isHidden = dropdown.classList.contains('hidden');
            
            if (isHidden) {
                dropdown.classList.remove('hidden');
                document.getElementById('country-search-input').value = '';
                renderCountries(countries);
                document.getElementById('country-search-input').focus();
            } else {
                dropdown.classList.add('hidden');
            }
        }

        // Filter country list by search term
        function filterCountries() {
            const query = document.getElementById('country-search-input').value.toLowerCase().trim();
            const filtered = countries.filter(c => 
                c.name.toLowerCase().includes(query) || 
                c.iso.toLowerCase().includes(query) || 
                c.code.includes(query)
            );
            renderCountries(filtered);
        }

        // Select country from dropdown
        function selectCountry(country) {
            document.getElementById('selected-country-flag').textContent = country.flag;
            document.getElementById('selected-country-code').textContent = `${country.iso} ${country.code}`;
            document.getElementById('country-dropdown').classList.add('hidden');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('country-dropdown');
            const isClickInside = dropdown.contains(event.target);
            if (!isClickInside && !dropdown.classList.contains('hidden')) {
                dropdown.classList.add('hidden');
            }
        });

        function switchTab(tab) {
            const phoneTabBtn = document.getElementById('phone-tab-btn');
            const emailTabBtn = document.getElementById('email-tab-btn');
            const phoneTabView = document.getElementById('phone-tab-view');
            const emailTabView = document.getElementById('email-tab-view');

            if (tab === 'phone') {
                phoneTabBtn.classList.add('text-gray-900', 'border-black');
                phoneTabBtn.classList.remove('text-gray-400', 'hover:text-gray-600', 'border-transparent');

                emailTabBtn.classList.remove('text-gray-900', 'border-black');
                emailTabBtn.classList.add('text-gray-400', 'hover:text-gray-600', 'border-transparent');

                phoneTabView.classList.remove('hidden');
                phoneTabView.classList.add('block');
                emailTabView.classList.remove('block');
                emailTabView.classList.add('hidden');
            } else {
                emailTabBtn.classList.add('text-gray-900', 'border-black');
                emailTabBtn.classList.remove('text-gray-400', 'hover:text-gray-600', 'border-transparent');

                phoneTabBtn.classList.remove('text-gray-900', 'border-black');
                phoneTabBtn.classList.add('text-gray-400', 'hover:text-gray-600', 'border-transparent');

                emailTabView.classList.remove('hidden');
                emailTabView.classList.add('block');
                phoneTabView.classList.remove('block');
                phoneTabView.classList.add('hidden');
            }
        }

        function checkPhoneForm() {
            const phoneInput = document.getElementById('phone-input').value.trim();
            const btn = document.getElementById('phone-login-btn');

            if (phoneInput.length > 3) {
                btn.removeAttribute('disabled');
                btn.classList.remove('bg-[#f1f1f2]', 'text-gray-300', 'cursor-not-allowed');
                btn.classList.add('bg-[#fe2c55]', 'text-white', 'hover:bg-[#e02648]', 'cursor-pointer');
            } else {
                btn.setAttribute('disabled', 'true');
                btn.classList.add('bg-[#f1f1f2]', 'text-gray-300', 'cursor-not-allowed');
                btn.classList.remove('bg-[#fe2c55]', 'text-white', 'hover:bg-[#e02648]', 'cursor-pointer');
            }
        }

        function checkEmailForm() {
            const emailInput = document.getElementById('email-input').value.trim();
            const passwordInput = document.getElementById('password-input').value.trim();
            const btn = document.getElementById('email-login-btn');

            if (emailInput.length > 0 && passwordInput.length > 0) {
                btn.removeAttribute('disabled');
                btn.classList.remove('bg-[#f1f1f2]', 'text-gray-300', 'cursor-not-allowed');
                btn.classList.add('bg-[#fe2c55]', 'text-white', 'hover:bg-[#e02648]', 'cursor-pointer');
            } else {
                btn.setAttribute('disabled', 'true');
                btn.classList.add('bg-[#f1f1f2]', 'text-gray-300', 'cursor-not-allowed');
                btn.classList.remove('bg-[#fe2c55]', 'text-white', 'hover:bg-[#e02648]', 'cursor-pointer');
            }
        }

        // Initial render of countries
        renderCountries(countries);
    </script>
</body>
